<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17161A" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <script>
      // Apply the cached theme before first paint (see src/lib/theme.ts).
      try {
        const t = localStorage.getItem('transcoda.theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch {
        // Storage blocked: the page paints in the system theme.
      }
    </script>
    <title>Transcoda</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
