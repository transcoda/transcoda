name: Nightly

# Every test, every night, when main has changed since the last nightly: the unit tests with the
# fixture media (pull requests skip the real-ffmpeg ones), and the browser and screenshot tests.
# A failing test gets a GitHub issue labelled `nightly` (scripts/nightly-issues.ts); one that passes
# again gets its issue closed. Run it by hand from the Actions tab: that always runs.

on:
  schedule:
    # 07:17 UTC: 02:17 in New York (03:17 in summer), off the hour when GitHub's queue is busiest.
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The commit the last finished nightly tested (any outcome: a failure on the same commit
          # would only fail again).
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main is still at ${GITHUB_SHA:0:7}, as in the last nightly: nothing to test"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # In the e2e container, so the real-ffmpeg tests run against the image's jellyfin-ffmpeg.
      - run: sh scripts/e2e-docker.sh --unit
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-unit
          path: .local/nightly/vitest.json
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/e2e-docker.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e2e
          path: |
            .local/nightly/playwright.json
            .local/e2e-report
            .local/e2e-results
          retention-days: 14
          if-no-files-found: ignore

  issues:
    needs: [changed, unit, e2e]
    if: ${{ !cancelled() && needs.changed.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-*
          path: .local/artifacts
      - name: Open, update and close the nightly issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          RUN_FAILED: ${{ needs.unit.result != 'success' || needs.e2e.result != 'success' }}
          # The tests ran in the container's copy of the repo.
          TEST_ROOT: /work/repo
        run: |
          node scripts/nightly-issues.ts \
            .local/artifacts/nightly-unit/vitest.json \
            .local/artifacts/nightly-e2e/nightly/playwright.json
