name: Nightly

# Every test, every night, when main has changed since the last nightly: the unit tests with the
# fixture media (pull requests skip the real-ffmpeg ones), and the browser and screenshot tests.
# A failing test gets a GitHub issue labelled `nightly`; one that passes again gets its issue closed
# (the org's nightly-issues action). Run it by hand from the Actions tab: that always runs.

on:
  schedule:
    # 07:17 UTC: 02:17 in New York (03:17 in summer), off the hour when GitHub's queue is busiest.
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      # 'true' when main moved since the last finished nightly (any outcome: a failure on the same
      # commit would only fail again), when there is none, or on a manual run.
      - id: changed
        uses: transcoda/.github/actions/nightly-changed@690ae52154e1b41a4cbd3b33069f1e590daa011d # v1.1.1

  unit:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # In the e2e container, so the real-ffmpeg tests run against the image's jellyfin-ffmpeg.
      # The property tests try 10000 cases each instead of 100 (about 10 s more in all).
      - run: sh scripts/e2e-docker.sh --unit
        env:
          FC_NUM_RUNS: 10000
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-unit
          path: .local/nightly/vitest.json
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/e2e-docker.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e2e
          path: |
            .local/nightly/playwright.json
            .local/e2e-report
            .local/e2e-results
          retention-days: 14
          if-no-files-found: ignore

  issues:
    needs: [changed, unit, e2e]
    if: ${{ !cancelled() && needs.changed.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-*
          path: .local/artifacts
      - uses: transcoda/.github/actions/nightly-issues@690ae52154e1b41a4cbd3b33069f1e590daa011d # v1.1.1
        with:
          reports: |
            .local/artifacts/nightly-unit/vitest.json
            .local/artifacts/nightly-e2e/nightly/playwright.json
          run-failed: ${{ needs.unit.result != 'success' || needs.e2e.result != 'success' }}
          # The tests ran in the container's copy of the repo.
          test-root: /work/repo
