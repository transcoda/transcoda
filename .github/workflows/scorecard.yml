name: Scorecard

# OpenSSF Scorecard: checks the repository's supply-chain practices (pinned actions, branch
# protection, token permissions, signed releases) and publishes the result to the code scanning
# tab and to the public badge.
on:
  push:
    branches: [main]
  # Branch protection changes don't trigger a push, so a weekly run picks them up too.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# Scorecard refuses to publish results from a workflow with top-level write permissions.
permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      # Signs the results it publishes to the OpenSSF API, which serves the badge.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
