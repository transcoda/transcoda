name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/transcoda/transcoda
          # No type=sha tags: superseded builds become untagged and can be pruned.
          # A release tag v0.2.1 publishes 0.2.1, 0.2 and latest; a pre-release (v0.3.0-rc.1)
          # publishes only its own version. `main` follows the main branch.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # Runs after the push, so the image is already published when this runs: a failure is a red
  # workflow on an existing tag. Accepted; building to a local tag per arch first would double
  # the build time. Each arch runs natively (the sandbox's /proc behaviour differs from emulation).
  sandbox:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The first tag the metadata action produced for this run (branch name or version).
      - name: Run the plugin sandbox denial check inside the image
        env:
          TAGS: ${{ needs.image.outputs.tags }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          set -eu
          image="$(printf '%s\n' "$TAGS" | head -n 1)"
          docker pull --platform "$PLATFORM" "$image"
          # Shows the host's first stderr line when the check fails. The flags are the compose
          # file's (docker/docker-compose.yml); only the last stdout line is the JSON result.
          docker run --rm --platform "$PLATFORM" -e PUID=1234 -e PGID=1234 --memory=512m \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add FSETID \
            --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --cap-add KILL \
            --read-only --tmpfs /tmp --tmpfs /run/transcoda:mode=0755 --pids-limit 1024 \
            "$image" \
            node /app/server/main.js --check-plugin /app/server/fixtures/denial.js \
            --expect-denials --other-bundle /app/server/main.js 2>&1 | tee sandbox.log
          code="${PIPESTATUS[0]}"
          echo "first output line: $(head -n 1 sandbox.log)"
          [ "$code" -eq 0 ] || exit "$code"
          tail -n 1 sandbox.log | jq -e '.ok and .probes == 19 and .isolation.uid == 65001 and .isolation.capEff == "0000000000000000" and .isolation.capPrm == "0000000000000000" and .isolation.capAmb == "0000000000000000" and .isolation.noNewPrivs == 1'

  # The compose file as shipped, against the image that was just built: the server keeps three
  # capabilities, plugin hosts and server children none, /config is unreadable for the plugin user.
  hardening:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Keep the node image in sync with NODE_IMAGE in docker/Dockerfile.
      - name: Entrypoint checks (base image, real setpriv)
        run: |
          set -eu
          docker run --rm --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --cap-add FSETID --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --cap-add KILL \
            --security-opt no-new-privileges:true -v "$PWD/docker:/t:ro" \
            -e TRANSCODA_CONFIG_DIR=/tmp/cfg -e TRANSCODA_TRANSCODE_DIR=/tmp/tc \
            -e TRANSCODA_PLUGIN_RUN_DIR=/tmp/run node:24.22.1-bookworm-slim sh /t/entrypoint.test.sh
      - name: Start the shipped compose file
        env:
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          set -eu
          image="$(printf '%s\n' "$TAGS" | head -n 1)"
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/transcode"
          sed -e "s#^    image: .*#    image: $image#" \
            -e "s#\./config:/config#$RUNNER_TEMP/config:/config#" \
            -e "s#/mnt/ssd/transcode:/transcode#$RUNNER_TEMP/transcode:/transcode#" \
            docker/docker-compose.yml > "$RUNNER_TEMP/compose.yml"
          cat "$RUNNER_TEMP/compose.yml"
          docker compose -f "$RUNNER_TEMP/compose.yml" up -d
          for _ in $(seq 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' transcoda)"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker compose -f "$RUNNER_TEMP/compose.yml" logs
          echo "not healthy after 60 s (last status: $status)"
          exit 1
      - name: Server capabilities are exactly SETUID, SETGID, KILL
        run: |
          set -eu
          docker compose -f "$RUNNER_TEMP/compose.yml" exec -T transcoda sh -c 'grep -E "^(CapPrm|CapEff|CapAmb|CapBnd|NoNewPrivs)" /proc/$(pgrep -f "^node /app/server/main.js$")/status' | tee caps.log
          [ "$(grep -c -E '^Cap.*00000000000000e0$' caps.log)" -eq 4 ]
          grep -q -E '^NoNewPrivs:[[:space:]]+1$' caps.log
      # A file-permission check only: the proof that plugin hosts really run as the plugin user
      # with no capabilities is the sandbox job's isolation assertion.
      - name: The plugin user cannot read /config or /transcode, or signal the server
        run: |
          set -eu
          docker compose -f "$RUNNER_TEMP/compose.yml" exec -T -u 65001:65001 transcoda sh -c '! ls /config && ! cat /config/secret.key && ! ls /transcode'
          docker compose -f "$RUNNER_TEMP/compose.yml" exec -T -u 65001:65001 transcoda sh -c 'pid=$(pgrep -f "^node /app/server/main.js$") && ! kill -0 "$pid"'
      - name: Read-only root, staging directory, ffmpeg under the hardening
        run: |
          set -eu
          if docker compose -f "$RUNNER_TEMP/compose.yml" exec -T transcoda sh -c 'touch /app/x'; then
            echo "the root filesystem is writable"
            exit 1
          fi
          test "$(docker compose -f "$RUNNER_TEMP/compose.yml" exec -T transcoda stat -c '%a %u:%g' /run/transcoda/plugins)" = "2710 1000:65001"
          docker compose -f "$RUNNER_TEMP/compose.yml" exec -T -u 1000:1000 transcoda /usr/lib/jellyfin-ffmpeg/ffmpeg -v error -f lavfi -i testsrc=duration=1:size=64x64:rate=5 -f null -
      - name: Children of the server (ffmpeg, ffprobe) start with no capabilities
        env:
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          set -eu
          image="$(printf '%s\n' "$TAGS" | head -n 1)"
          # The argv mirrors apps/server/src/engine/child-caps.ts; keep them in sync.
          # The same setpriv line the server uses for engine children, run under the real entrypoint.
          docker run --rm --security-opt no-new-privileges:true --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add FSETID \
            --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --cap-add KILL \
            --read-only --tmpfs /tmp --tmpfs /run/transcoda:mode=0755 \
            --entrypoint /usr/local/bin/transcoda-entrypoint "$image" \
            setpriv --inh-caps=-all --ambient-caps=-all --no-new-privs -- \
            grep -E '^(CapPrm|CapEff|CapInh|CapAmb|NoNewPrivs)' /proc/self/status | tee child.log
          [ "$(grep -c -E '^Cap(Prm|Eff|Inh|Amb):[[:space:]]+0000000000000000$' child.log)" -eq 4 ]
          grep -q -E '^NoNewPrivs:[[:space:]]+1$' child.log
      - name: No isolation warnings in the server log
        run: |
          set -eu
          docker compose -f "$RUNNER_TEMP/compose.yml" logs > server.log
          if grep -E "plugin hosts run as the server's user|transcoda-entrypoint: warning" server.log; then exit 1; fi
      - name: Tear down
        if: always()
        run: docker compose -f "$RUNNER_TEMP/compose.yml" down -v
