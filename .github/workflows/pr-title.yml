name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: transcoda/.github/actions/pr-title@784e49e74a14c822b9b11abac94b748950e06950 # pre-release: transcoda/.github#1 head, moves to v1.0.0 once tagged
