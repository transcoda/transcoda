name: Release note

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  release-note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The shared checker (@transcoda/dev-config's transcoda-release-note); notes sit directly in
      # .changes/. Format: .changes/README.md.
      - uses: transcoda/.github/actions/release-note@43cbb990910eca37108711aedaa1b939835a1941 # v1.1.0
        with:
          layout: flat
