name: Release note

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  release-note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: transcoda/.github/actions/release-note@82943f154f47d0c67751fe842278e7f4b889dca9 # v1.0.0
