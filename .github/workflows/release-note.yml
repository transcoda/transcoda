name: Release note

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  release-note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: transcoda/.github/actions/release-note@784e49e74a14c822b9b11abac94b748950e06950 # pre-release: transcoda/.github#1 head, moves to v1.0.0 once tagged
