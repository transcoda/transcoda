name: Release note

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  release-note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The shared checker (@transcoda/dev-config's transcoda-release-note); notes sit directly in
      # .changes/. Format: .changes/README.md.
      - uses: transcoda/.github/actions/release-note@690ae52154e1b41a4cbd3b33069f1e590daa011d # v1.1.1
        with:
          layout: flat
