name: CI

on:
  # Branches are checked by their pull request; a push run as well would only double the work.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck + lint + knip + check-deps + check-structure + check-licences + file size + test (`pnpm ci` is reserved by pnpm 12).
      # Licence allow-list: part of pnpm check (scripts/third-party-notices.ts --check).
      - run: pnpm check
      - run: pnpm build
      # The user split (PUID, plugin user, capabilities) cannot break behind green checks. Same
      # invocation as docker.yml, in the image's base (NODE_IMAGE in docker/Dockerfile, tag and digest).
      - name: Entrypoint checks (base image, real setpriv)
        run: |
          set -eu
          node_image=$(sed -n 's/^ARG NODE_IMAGE=//p' docker/Dockerfile)
          test -n "$node_image"
          docker run --rm --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --cap-add FSETID --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --cap-add KILL \
            --security-opt no-new-privileges:true -v "$PWD/docker:/t:ro" \
            -e TRANSCODA_CONFIG_DIR=/tmp/cfg -e TRANSCODA_TRANSCODE_DIR=/tmp/tc \
            -e TRANSCODA_PLUGIN_RUN_DIR=/tmp/run "$node_image" sh /t/entrypoint.test.sh

  # No source file over 1200 lines. Files already over it are in .github/file-size-allowlist.json
  # at their current size, which may only shrink. The globs are the same as `pnpm check-file-size`
  # in package.json; change both together. Rule: docs/dev/conventions.md, "File size".
  file-size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: transcoda/.github/actions/file-size@690ae52154e1b41a4cbd3b33069f1e590daa011d # v1.1.1
        with:
          max-lines: 1200
          allowlist: .github/file-size-allowlist.json
          globs: |
            apps/**/*.{ts,tsx,mts,mjs,css}
            packages/**/*.{ts,tsx,mts,mjs}
            scripts/**/*.{ts,mts,mjs}
            e2e/**/*.{ts,mjs}
            *.{ts,mts,mjs}
            !**/fixtures/**

  # Browser tests (Playwright) against the built server and the fixture media, screenshots included.
  # They run in e2e/Dockerfile's container, as `pnpm e2e:docker` does locally, so the baselines
  # match. Strategy and time budget: docs/dev/testing.md, "Tiers".
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/e2e-docker.sh
      # On a screenshot failure the results hold the actual image and the diff next to the baseline.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            .local/e2e-report
            .local/e2e-results
          retention-days: 14
          if-no-files-found: ignore
