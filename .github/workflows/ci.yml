name: CI

on:
  # Branches are checked by their pull request; a push run as well would only double the work.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck + lint + check-deps + check-licences + test (`pnpm ci` is reserved by pnpm 12).
      # Licence allow-list: part of pnpm check (scripts/third-party-notices.ts --check).
      - run: pnpm check
      - run: pnpm build
      # The user split (PUID, plugin user, capabilities) cannot break behind green checks. Same
      # invocation as docker.yml; keep the node image in sync with NODE_IMAGE in docker/Dockerfile.
      - name: Entrypoint checks (base image, real setpriv)
        run: |
          set -eu
          docker run --rm --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --cap-add FSETID --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --cap-add KILL \
            --security-opt no-new-privileges:true -v "$PWD/docker:/t:ro" \
            -e TRANSCODA_CONFIG_DIR=/tmp/cfg -e TRANSCODA_TRANSCODE_DIR=/tmp/tc \
            -e TRANSCODA_PLUGIN_RUN_DIR=/tmp/run node:24.22.1-bookworm-slim sh /t/entrypoint.test.sh
